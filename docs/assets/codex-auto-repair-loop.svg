<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex automatic repair loop</title>
  <desc id="desc">A workflow diagram showing the app sending diagnostics to the observability stack, the gateway giving evidence to Codex, and Codex repairing code before the same UI workload is replayed.</desc>
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d8dee9"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2f5fb3"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3b9b35"/>
    </marker>
  </defs>

  <rect width="1120" height="620" fill="#ffffff"/>
  <text x="42" y="54" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Giving Codex a full observability stack</text>

  <rect x="44" y="178" width="128" height="72" rx="18" fill="url(#dots)" stroke="#111827" stroke-width="2"/>
  <text x="108" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">App</text>

  <line x1="108" y1="250" x2="108" y2="330" stroke="#111827" stroke-width="2"/>
  <text x="108" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">logs</text>
  <text x="108" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">metrics</text>
  <text x="108" y="322" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">traces</text>

  <rect x="40" y="330" width="136" height="76" rx="26" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="108" y="375" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Collector</text>

  <rect x="250" y="104" width="420" height="372" rx="8" fill="url(#dots)" stroke="#111827" stroke-width="2"/>
  <text x="286" y="148" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Observability stack</text>

  <path d="M176 368 C210 368 210 210 250 210" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M176 368 C210 368 210 290 250 290" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M176 368 C210 368 210 370 250 370" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="176" width="130" height="64" rx="30" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="355" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Victoria</text>
  <text x="355" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Logs</text>

  <rect x="290" y="256" width="130" height="64" rx="30" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="355" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Victoria</text>
  <text x="355" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Metrics</text>

  <rect x="290" y="336" width="130" height="64" rx="30" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="355" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Victoria</text>
  <text x="355" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Traces</text>

  <rect x="492" y="176" width="126" height="64" rx="30" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="555" y="213" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">LogQL API</text>
  <rect x="492" y="256" width="126" height="64" rx="30" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="555" y="293" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">PromQL API</text>
  <rect x="492" y="336" width="126" height="64" rx="30" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="555" y="373" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">TraceQL API</text>

  <line x1="420" y1="208" x2="492" y2="208" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="288" x2="492" y2="288" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="368" x2="492" y2="368" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M618 208 C700 208 690 214 730 214" fill="none" stroke="#2f5fb3" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M618 288 C700 288 690 214 730 214" fill="none" stroke="#2f5fb3" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M618 368 C700 368 690 214 730 214" fill="none" stroke="#2f5fb3" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="730" y="174" width="138" height="80" rx="22" fill="#ffffff" stroke="#2f5fb3" stroke-width="2"/>
  <text x="799" y="206" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Gateway</text>
  <text x="799" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">bounded evidence</text>

  <line x1="868" y1="214" x2="920" y2="214" stroke="#2f5fb3" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="920" y="174" width="124" height="80" rx="22" fill="url(#dots)" stroke="#3b9b35" stroke-width="2"/>
  <text x="982" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#111827">Codex</text>

  <text x="900" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827">query</text>
  <text x="940" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827">repair</text>
  <line x1="982" y1="254" x2="982" y2="326" stroke="#3b9b35" stroke-width="2" marker-end="url(#green-arrow)"/>

  <rect x="920" y="326" width="124" height="76" rx="20" fill="url(#dots)" stroke="#111827" stroke-width="2"/>
  <text x="982" y="370" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Codebase</text>

  <path d="M1044 364 C1080 364 1080 504 792 504 C520 504 520 500 520 440" fill="none" stroke="#3b9b35" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="910" y="488" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#3b9b35">re-run same UI workload</text>

  <text x="724" y="538" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#3b9b35">feedback loop: observe -> repair -> restart -> replay</text>
</svg>
