[project]
name = "todo-api"
version = "0.1.0"
description = "Local Todo CRUD API for the observability pipeline demo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
    "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
    "opentelemetry-instrumentation-sqlite3>=0.59b0,<1",
    "opentelemetry-sdk>=1.38,<2",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
